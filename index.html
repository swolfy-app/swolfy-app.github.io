<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스월피 (SWOLFY)</title>
<meta name="description" content="스월피(SWOLFY) — 스마트워치 수영 기록을 SWOLF로 분석하는 앱">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f3f9fe;--card:#fff;--ink:#14324f;--muted:#5b7089;--line:#dbe8f4;--sky:#3fa9f5;--coral:#ff7a59;--soft:#e3f4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b2a;--card:#16263a;--ink:#e6f0fa;--muted:#9fb3c8;--line:#24384f;--sky:#7cc6ff;--coral:#ff9a80;--soft:#1b3350}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--sky)}
header{background:linear-gradient(180deg,#dff2ff,#bfe4ff);color:#14324f}
@media (prefers-color-scheme:dark){header{background:linear-gradient(180deg,#1a3a5c,#1f4a72);color:#e6f0fa}}
.bar{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;text-decoration:none;color:inherit;margin-right:auto}
.bar nav a{color:inherit;text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.45)}
@media (prefers-color-scheme:dark){.bar nav a{background:rgba(255,255,255,.1)}}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
h1{font-size:28px;line-height:1.3;margin:0 0 12px}
h2{font-size:19px;margin:32px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;min-width:90px}
th{background:var(--soft)}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.92em}
.lang{display:inline-block;margin-bottom:16px;font-size:14px}
.hero{text-align:center;padding:24px 0 8px}
.hero .emoji{font-size:64px}
.hero p{color:var(--muted);max-width:560px;margin:8px auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit}
.card b{display:block;margin-bottom:4px}
.card span{color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="">🐬 스월피</a><nav><a href="privacy/">개인정보처리방침</a><a href="terms/">이용약관</a></nav></div></header>
<main>
<section class="hero"><div class="emoji">🐢 🐡 🐠 🦦 🦭 🦈 🐬</div>

<p>스마트워치 수영 기록을 SWOLF로 분석하고, 바다 동물 등급과 칭호, 코치 코멘트로 보여주는 수영 기록 앱입니다.</p></section>
<div class="cards">
<a class="card" href="privacy/"><b>개인정보처리방침</b><span>수영 기록은 휴대폰에만 저장돼요</span></a>

<a class="card" href="mailto:helpswolfy@gmail.com"><b>문의</b><span>helpswolfy@gmail.com</span></a>
<a class="card" href="en/"><b>English</b><span>SWOLFY in English</span></a>
</div>
</main>
<footer>© MARI MIMI · <a href="mailto:helpswolfy@gmail.com">helpswolfy@gmail.com</a></footer>
</body>
</html>
